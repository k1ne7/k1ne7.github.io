# Overrides only: keep the official Butterfly theme intact for upgrades.
nav:
  fixed: true
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  友链: /link/ || fas fa-link
  关于: /about/ || fas fa-user

social:
  fab fa-github: https://github.com/k1ne7 || GitHub
  fab fa-bilibili: https://space.bilibili.com/480238577 || Bilibili
  fas fa-rss: /atom.xml || RSS

favicon: /images/avatar.jpg
avatar:
  img: /images/avatar.jpg
  effect: false
index_img: /images/meet.jpg
default_top_img: /images/meet.jpg
archive_img: /images/meet.jpg
background: /images/meet.jpg
index_top_img_height: 100vh
subtitle:
  enable: true
  effect: true
  source: false
  typed_option:
    typeSpeed: 110
    startDelay: 500
    loop: false
  sub:
    - 真正的热爱又如何会感到疲倦和厌烦呢？倘若时时刻刻都怀揣着强烈的创作激情与成为强者的渴望，那便永远纵情燃烧，不舍昼夜。
index_layout: 3
index_post_content:
  method: 2
  length: 140

aside:
  enable: true
  mobile: true
  card_author:
    description: 追寻心中的旗帜
    button:
      enable: true
      icon: fab fa-github
      text: 我的 GitHub
      link: https://github.com/k1ne7
  card_announcement:
    enable: true
    content: "k1ne's Blog"

footer:
  owner:
    enable: true
    since: 2026
  copyright:
    enable: true
    version: false
  custom_text: 追寻心中的旗帜

darkmode:
  enable: true
  button: true
  autoChangeMode: 1
search:
  use: local_search
  placeholder: 搜索文章
  local_search:
    preload: false
    top_n_per_article: 2
    unescape: false
share:
  use: false
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true
comments:
  use: Giscus
  text: true
  lazyload: true
  count: false
  card_post_count: false
giscus:
  repo: k1ne7/k1ne7.github.io
  repo_id: R_kgDOVQipVg
  category_id: DIC_kwDOVQipVs4DJ1Vu
  light_theme: light
  dark_theme: dark
  option:
    data-category: Announcements
    data-mapping: pathname
    data-strict: '1'
    data-reactions-enabled: '1'
    data-emit-metadata: '0'
    data-input-position: top
    data-lang: zh-CN
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true
# Reprinted poems retain their attribution, without adding an author license.
post_copyright:
  enable: false
lightbox: false
lazyload:
  enable: true
  native: true
  field: site
font:
  global_font_size: 16px
  font_family: '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif'

theme_color:
  enable: true
  main: '#7850b8'
  paginator: '#7850b8'
  button_hover: '#613c9d'
  text_selection: '#9c78cd'
  link_color: '#7044ad'
  hr_color: '#b99bdc'
  toc_color: '#7850b8'
  blockquote_padding_color: '#9771c8'
  blockquote_background_color: '#9771c8'
  scrollbar_color: '#9771c8'
  meta_theme_color_light: '#f2edf8'
  meta_theme_color_dark: '#191322'

CDN:
  internal_provider: local
  third_party_provider: jsdelivr
  option:
    fontawesome: /vendor/fontawesome/css/all.min.css
    typed: /vendor/typed/typed.umd.js
    busuanzi: /js/view-counter.js?v=20261029-1
inject:
  head:
    - <link rel="alternate" type="application/atom+xml" title="k1ne" href="/atom.xml">
    - <link rel="stylesheet" href="/css/custom.css?v=20261022-2">
  bottom:
    - <script src="/js/black-hole.js?v=20261026-1" defer></script>
